    <script type="text/javascript">
      (function (l) {
        // 1. Check sessionStorage for instant clean restoration
        try {
          var redirect = sessionStorage.getItem('spa_redirect');
          if (redirect) {
            sessionStorage.removeItem('spa_redirect');
            window.history.replaceState(null, null, redirect);
            return;
          }
        } catch (e) {}

        // 2. Check query string ?/route fallback
        if (l.search && (l.search.slice(0, 2) === '?/' || l.search[1] === '/')) {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&');
            })
            .join('?');
          var basePath = l.pathname.endsWith('/') ? l.pathname.slice(0, -1) : l.pathname;
          var targetPath = decoded.startsWith('/') ? decoded : '/' + decoded;
          window.history.replaceState(
            null,
            null,
            basePath + targetPath + l.hash
          );
        }
